<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="options-panel" class="options-panel">
        <div id="paint-options" class="paint-options">
            <div id="color-buttons" class="color-buttons">
                <button class="black" data-color="#161616"></button>
                <button class="erase" data-color="white"></button>
                <button class="red" data-color="#EB0800"></button>
                <button class="blue" data-color="#000CAD"></button>
                <button class="yellow" data-color="#F4C610"></button>
                <button class="green" data-color="#4DA815"></button>
            </div>
            <div id="size-buttons" class="size-buttons">
                <button data-size="1">1x1</button>
                <button data-size="2">2x2</button>
                <button data-size="3">3x3</button>
                <button data-size="5">5x5</button>
            </div>
        </div>
        <button id="hide-button" class="hide-button">hide</button>
    </div>

    <div id="canvas-map"></div>

    <script src="script.js"></script>
</body>
</html>
